name: Lean CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check architecture source graph and Python tooling
        run: |
          python -m py_compile tools/architecture/generate_baseline.py tools/architecture/check_compatibility.py tools/architecture/check_layout.py tools/architecture/check_phase.py tools/architecture/check_phase_projection.py tools/architecture/check_completion_phase_projection.py tools/architecture/check_completion_phase.py tools/architecture/check_provenance.py tools/architecture/normalize_apache_notices.py tools/architecture/sort_aggregate_imports.py tools/benchmark/run.py
          python tools/architecture/check_phase.py --self-test
          python tools/architecture/check_phase_projection.py --self-test
          python tools/architecture/check_completion_phase_projection.py --self-test
          python tools/architecture/check_completion_phase.py --self-test
          python tools/architecture/check_phase.py --all-phases
          python tools/architecture/check_completion_phase.py
          python tools/architecture/check_layout.py
          python tools/architecture/check_compatibility.py
          python tools/architecture/check_provenance.py
          python tools/architecture/generate_baseline.py --skip-declarations --strict-source --output-dir benchmark-results/ci-architecture --name source
      - name: Build library and smoke tests
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: NumStability NumStabilityTest
          test: false
          lint: false
      - name: Run lake test
        run: lake test
      - name: Check the warning baseline
        run: |
          set -o pipefail
          lake build NumStability NumStabilityTest 2>&1 | tee "$RUNNER_TEMP/lean-build.log"
          python tools/architecture/check_warnings.py --log "$RUNNER_TEMP/lean-build.log" --baseline docs/architecture/warnings.json --check
