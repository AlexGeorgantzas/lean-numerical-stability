name: Lean CI

on:
  push:
    branches:
      - main
      - higham_v01
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Build package
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: NumStability
          test: false
          lint: false
      - name: Check public lookup surface
        run: lake env lean examples/LibraryLookup.lean
